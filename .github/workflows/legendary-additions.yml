name: Build LegendaryAdditions

on:
  push:
    paths:
      - 'legendary-additions/**'
      - '.github/workflows/legendary-additions.yml'
  pull_request:
    paths:
      - 'legendary-additions/**'
      - '.github/workflows/legendary-additions.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legendary-additions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: legendary_additions
          path: legendary-additions/build/libs/legendary_additions-*.jar
