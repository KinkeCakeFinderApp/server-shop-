name: Build LegendaryAdditions

on:
  push:
    paths:
      - 'legendary-additions/**'
      - '.github/workflows/legendary-additions.yml'
  pull_request:
    paths:
      - 'legendary-additions/**'
      - '.github/workflows/legendary-additions.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legendary-additions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: legendary_additions
          path: legendary-additions/build/libs/legendary_additions-*.jar

  folia-server-test:
    # Boots a real Folia 26.1.2 server twice with the plugin and its opt-in self-test.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/download-artifact@v4
        with:
          name: legendary_additions
          path: jar

      - name: Boot Folia twice and check the plugin
        run: bash .github/scripts/folia-server-test.sh

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folia-server-logs
          path: server/boot*.log

  ingame-rod-test:
    # A mineflayer bot joins a real Folia 26.1.2 server and casts every rod.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bot
        working-directory: .github/scripts/rod-bot
        run: npm install --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: legendary_additions
          path: jar

      - name: Bot casts every rod
        run: bash .github/scripts/ingame-rod-test.sh

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingame-test-logs
          path: |
            ingame/server.log
            ingame/bot.log
