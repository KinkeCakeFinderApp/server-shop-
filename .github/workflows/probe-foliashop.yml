name: Probe FoliaShop
on:
  push:
    paths: ['.github/workflows/probe-foliashop.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - run: |
          URL=$(curl -fsS "https://api.modrinth.com/v2/project/foliashop/version" | python3 -c "import json,sys;v=json.load(sys.stdin)[0];print(v['files'][0]['url'])")
          curl -fsSL -o fs.jar "$URL"; mkdir x; cd x; unzip -q ../fs.jar
          for c in Price ShopItem ShopManager ShopListener FoliaShopPlugin EconomyService; do echo "=== $c"; javap -c -p -constants -cp . me.rakib.foliashop.$c | grep -v -E '^\s+[0-9]+: (aload|astore|iload|istore|dup|pop|iconst|dload|dstore|checkcast|goto|areturn|ireturn|return|nop|new |iinc|arraylength)'; done > dump.txt
          gzip -9 -c dump.txt | base64 -w0 > dump.b64; wc -c dump.txt dump.b64
          echo "DUMP_BEGIN"; cat dump.b64; echo; echo "DUMP_END"
