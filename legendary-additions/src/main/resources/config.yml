# LegendaryAdditions - admin rods, Admin dimension and suggestions (Folia 26.1.2)
#
# Every special rod fires the instant it is cast: the plugin ray-traces from the caster's
# eyes along their exact look direction, locks the hit point, then runs the effect.
# The fishing hook is never used for targeting. There are NO cooldowns anywhere -
# "warning-time-ticks" is an optional delay before impact (0 by default).

# Do not edit: used to update older config files automatically.
config-version: 4

# Extra sounds and particles made by the rods (warning beams, markers, charge-up sounds,
# smoke, impact sounds, teleport sparkles, the break sound of used-up rods...).
# Off by default. The rods still do their real effect (damage, knockback, explosions,
# skulls, wolves, arrows, teleport). Vanilla explosions still make their own normal boom.
rod-effects:
  sounds: false
  particles: false

rod-targeting:
  # Maximum ray-trace distance in blocks. On Folia the ray also stops at the edge of the
  # caster's region or at unloaded chunks, so shots into unloaded terrain report "no target".
  max-distance: 256.0
  # World names where special rods do nothing, e.g. ["world_nether"].
  disabled-worlds: []

teleport-rod:
  max-distance: 100.0
  # How far (blocks) around the looked-at spot to search for a safe standing place.
  safe-search-radius: 3
  allow-lava-destinations: false

# /stab, /stabshot
orbital-strike:
  # tnt    = the Unstable SMP / Orbital Strike Cannon stab: a column of primed TNT at the target
  #          from the build limit all the way down to bedrock. The top goes off first and the
  #          blast runs down the column, drilling a shaft to bedrock.
  # crater = the old stab: instant damage in "radius" and a silent crater.
  style: tnt
  # Blocks between two TNT in the column (1 = a TNT in every block, 384 TNT in the Overworld).
  tnt-spacing: 2
  # TNT per level of the column. More makes the shaft wider.
  tnt-per-layer: 1
  # Explosion power of each TNT (vanilla TNT is 4).
  tnt-power: 4.0
  # Ticks before the top TNT explodes (20 = 1 second).
  fuse-ticks: 20
  # How many blocks the blast travels down each tick. 0 = the whole column goes off at once.
  blocks-per-tick: 16
  destroy-blocks: true
  damage-owner: false
  # Crater settings (style: crater only).
  radius: 8.0
  damage: 50.0
  knockback: 2.5
  warning-time-ticks: 0
  crater-radius: 4.0
  create-fire: false

# /nuke, /nukeshot
nuke:
  # rings  = the Unstable SMP / Orbital Strike Cannon nuke: 1169 TNT spawn 70 blocks above the
  #          target and spread into 9 rings (out to 81 blocks) as they fall, then all go off together.
  # crater = the old nuke: instant damage in "radius" and a silent crater.
  style: rings
  # Ring settings (style: rings). Each ring radius needs a matching TNT count.
  ring-radii: [9.8, 19.7, 28.9, 37.9, 46.7, 55.5, 64.1, 72.6, 81.1]
  ring-tnt-counts: [48, 96, 118, 132, 142, 150, 154, 162, 166]
  center-tnt: true
  # Blocks above the target where the TNT appears (capped at the world's build limit).
  spawn-height: 70.0
  # Ticks until the TNT explodes. The TNT speed is worked out from this so it lands on its ring.
  fuse-ticks: 80
  # How far (blocks) each TNT may randomly drift from its exact ring position.
  misalign: 0.0
  # Explosion power of each TNT (vanilla TNT is 4).
  tnt-power: 4.0
  destroy-blocks: true
  damage-owner: false
  # Crater settings (style: crater only).
  radius: 20.0
  damage: 150.0
  knockback: 5.0
  warning-time-ticks: 0
  crater-radius: 9.0
  create-fire: false

# /lawnuke, /lawnukeshot - carpet of TNT-strength blasts over a wide area.
law-nuke:
  radius: 45.0
  explosions: 140
  explosion-power: 4.0
  # Fuse before the blasts (0 = instant).
  warning-time-ticks: 0
  # Detonations ripple outward over this many ticks.
  detonation-ticks: 30
  destroy-blocks: true
  create-fire: false
  damage-owner: false

# /withernuke, /withernukeshot - charged wither skulls rain from above the target.
wither-nuke:
  skull-count: 160
  spawn-height: 70.0
  max-horizontal-speed: 2.3
  charged-skulls: true
  destroy-blocks: true
  damage-owner: false
  skulls-per-tick: 20

# /wolfrod, /wolfrod shot - an armoured, buffed wolf pack tamed to the caster.
wolf-rod:
  count: 53
  wolf-armor: true
  strength-amplifier: 1
  speed-amplifier: 1
  buff-duration-ticks: 1800
  fire-resistance-ticks: 9600
  # 0 = wolves stay forever. Otherwise they vanish after this many seconds.
  lifetime-seconds: 0

# /arrowrod, /arrowrodshot - a grid of arrows fired straight down.
arrow-rod:
  grid-size: 5
  layers: 2
  spawn-height: 86.0
  speed: 10.0
  damage: 70.0
  second-layer-damage: 80.0
  damage-owner: false

admin-dimension:
  # Key of the dimension shipped inside the plugin jar. Only change this if you know why.
  world: "adminplugin:admin"

suggestions:
  enabled: true
  # true: every player may browse, vote and submit. false: requires admindimension.suggestions.
  allow-all-players: true
  store-player-names: true
  min-length: 5
  max-length: 500
  allow-vote-removal: false
  # highest-votes, newest or oldest. Players can also cycle this in the GUI.
  sorting: highest-votes
  # How long a player has to type their suggestion into chat.
  input-timeout-seconds: 120
  # A player can have at most this many PENDING suggestions at once (0 = unlimited).
  max-pending-per-player: 5
  # Lets admins permanently delete suggestions from the review screen.
  allow-delete: true
  date-format: "yyyy-MM-dd HH:mm"
