name: LegendaryAdditions
version: '${version}'
main: net.srv.legendaryadditions.LegendaryAdditionsMod
bootstrapper: net.srv.legendaryadditions.LegendaryAdditionsBootstrap
api-version: '26.1'
folia-supported: true
description: Legendary items, a Legendary Creator, /shop admin, authenticated admin rods, a persistent Admin dimension and a suggestion GUI.
authors: [MCreator, srv]

permissions:
  legendaryadditions.give:
    description: Allows /legendary_additions give.
    default: op
  admindimension.use:
    description: Allows /admin and /admin return.
    default: op
  admindimension.orbitalrod:
    description: Allows /stab and /stabshot.
    default: op
  admindimension.nukerod:
    description: Allows /nuke and /nukeshot.
    default: op
  admindimension.teleportrod:
    description: Allows /teleportshot.
    default: op
  admindimension.lawnukerod:
    description: Allows /lawnuke and /lawnukeshot.
    default: op
  admindimension.withernukerod:
    description: Allows /withernuke and /withernukeshot.
    default: op
  admindimension.wolfrod:
    description: Allows /wolfrod and /wolfrod shot.
    default: op
  admindimension.arrowrod:
    description: Allows /arrowrod and /arrowrodshot.
    default: op
  admindimension.suggestions:
    description: Browse, vote and submit suggestions (only needed when suggestions.allow-all-players is false).
    default: true
  admindimension.suggestions.admin:
    description: Opens the admin suggestion backend and performs every admin action.
    default: op
  legendaryadditions.shopadmin:
    description: Opens /shop admin (/shopadmin) to add items and legendaries to FoliaShop and change prices.
    default: op
  admindimension.admin:
    description: Every admin rod, dimension and suggestion-admin permission.
    default: op
    children:
      admindimension.use: true
      admindimension.orbitalrod: true
      admindimension.nukerod: true
      admindimension.teleportrod: true
      admindimension.lawnukerod: true
      admindimension.withernukerod: true
      admindimension.wolfrod: true
      admindimension.arrowrod: true
      admindimension.suggestions: true
      admindimension.suggestions.admin: true
